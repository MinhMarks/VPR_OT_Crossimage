apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: vpr
  labels:
    app: triton
spec:
  replicas: 1              # GPU pods are expensive — 1 is enough to start
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.05-py3
          command:
            - tritonserver
            - --model-repository=/models
            - --allow-metrics=true
            - --metrics-port=8002
          ports:
            - containerPort: 8000   # HTTP
            - containerPort: 8001   # gRPC
            - containerPort: 8002   # Metrics
          volumeMounts:
            - name: model-store
              mountPath: /models
              readOnly: true
          resources:
            limits:
              nvidia.com/gpu: 1    # Request 1 GPU (requires nvidia device plugin)
            requests:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
      # Schedule Triton ONLY on GPU nodes
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: triton-models-pvc
