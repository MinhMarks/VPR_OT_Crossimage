apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vpr-ingress
  namespace: vpr
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"   # max upload size
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: vpr.yourdomain.com    # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi-svc
                port:
                  number: 80
  # TLS (enable after adding cert-manager or DNS challenge)
  # tls:
  #   - hosts:
  #       - vpr.yourdomain.com
  #     secretName: vpr-tls-secret
